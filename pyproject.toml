[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra"
version = "0.1.0"
description = "Learnable lyra attention for long-context Qwen3 models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.0",
  "datasets>=3.0",
  "safetensors>=0.4",
  "torch>=2.4",
  "transformers>=4.51,<6",
]

[project.optional-dependencies]
eval = [
  "jieba>=0.42",
  "rouge>=1.0.1",
]
test = [
  "pytest>=8",
  "tokenizers>=0.21",
]

[project.scripts]
lyra-train = "lyra.train:main"
lyra-generate = "lyra.generate:main"
lyra-eval = "lyra.eval_longbench:main"
lyra-score = "lyra.score_longbench:main"

[tool.setuptools.packages.find]
include = ["lyra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
